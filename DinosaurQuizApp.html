<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きょうりゅうクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  .dq-root {
    --ink: #2B1B12;
    --paper: #FAF1DD;
    --paper-2: #F1E2BE;
    --bg: #21382D;
    --bg-2: #152119;
    --amber: #E8A33D;
    --amber-deep: #C97A26;
    --moss: #7C9473;
    --moss-deep: #576B50;
    --correct: #4C9A5D;
    --correct-deep: #33613F;
    --wrong: #C1503A;
    --wrong-deep: #8E3A29;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif;
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
    background: radial-gradient(circle at 50% -10%, var(--bg) 0%, var(--bg-2) 75%);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 28px 14px 40px;
    margin: 0;
  }
  .dq-root *, .dq-root *::before, .dq-root *::after { box-sizing: border-box; }
  .dq-frame { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

  .dq-btn-base {
    border: 3px solid var(--ink);
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.08s ease;
  }
  .dq-btn-base:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink) !important; }
  .dq-btn-base:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* ---------- start screen ---------- */
  .dq-hero { text-align: center; padding: 12px 4px 4px; }
  .dq-title {
    margin: 0;
    font-size: clamp(2.1rem, 10vw, 2.8rem);
    font-weight: 800;
    color: var(--amber);
    line-height: 1.15;
    text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
  }
  .dq-subtitle {
    margin: 12px 0 0;
    color: var(--paper);
    font-weight: 500;
    font-size: 0.95rem;
    line-height: 1.7;
    opacity: 0.92;
  }
  .dq-lineup { display: flex; justify-content: center; gap: 10px; margin: 22px 0 6px; flex-wrap: wrap; }
  .dq-avatar-circle {
    width: 78px; height: 78px; border-radius: 999px;
    background: var(--paper);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    animation: dq-pop-in 0.55s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .dq-avatar-circle img { width: 88%; height: 88%; object-fit: contain; }
  @keyframes dq-pop-in { from { opacity: 0; transform: translateY(14px) scale(0.7); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .dq-best-pill {
    align-self: center;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper); border: 3px solid var(--moss-deep); border-radius: 999px;
    padding: 6px 16px; font-weight: 700; font-size: 0.85rem; color: var(--moss-deep);
    box-shadow: 3px 3px 0 var(--moss-deep);
  }

  .dq-cta {
    margin-top: 18px;
    background: var(--amber);
    color: var(--ink);
    font-weight: 800;
    font-size: 1.15rem;
    padding: 16px 20px;
    box-shadow: 4px 4px 0 var(--ink);
    width: 100%;
  }
  .dq-cta:active { background: var(--amber-deep); }

  .dq-ghost-btn {
    background: transparent; border: none; cursor: pointer; font-family: inherit;
    color: var(--paper); font-weight: 700; font-size: 0.85rem;
    padding: 8px; text-decoration: underline; text-underline-offset: 3px;
    transition: opacity 0.08s ease; align-self: center;
  }
  .dq-ghost-btn:active { opacity: 0.6; }
  .dq-ghost-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* ---------- playing screen ---------- */
  .dq-topbar { display: flex; justify-content: space-between; gap: 12px; }
  .dq-badge {
    flex: 1;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 8px 14px;
    text-align: center;
  }
  .dq-badge-label { font-size: 0.7rem; font-weight: 700; color: var(--ink); opacity: 0.6; }
  .dq-badge-num { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .dq-badge.urgent { border-color: var(--wrong); }
  .dq-badge.urgent .dq-badge-num { color: var(--wrong); animation: dq-pulse 0.85s ease-in-out infinite; }
  @keyframes dq-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  .dq-progress-track { height: 8px; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .dq-progress-fill { height: 100%; background: var(--amber); transition: width 0.9s linear; }
  .dq-progress-fill.urgent { background: var(--wrong); }

  .dq-stage {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 18px 16px 20px;
  }
  .dq-char-row { display: flex; align-items: flex-start; gap: 10px; }
  .dq-avatar-sm {
    flex: none; width: 64px; height: 64px; border-radius: 999px;
    background: var(--paper-2); border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .dq-avatar-sm img { width: 90%; height: 90%; object-fit: contain; }
  .dq-speech { position: relative; flex: 1; background: var(--paper-2); border: 3px solid var(--ink); border-radius: 16px; padding: 14px 14px 12px; margin-top: 8px; }
  .dq-speech-name {
    position: absolute; top: -13px; left: 14px;
    font-size: 0.72rem; font-weight: 800; color: #fff;
    padding: 3px 10px; border-radius: 999px; border: 2px solid var(--ink);
  }
  .dq-question-text { margin: 6px 0 0; font-weight: 700; font-size: 1.08rem; line-height: 1.55; }

  .dq-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .dq-choice-btn {
    background: var(--paper-2);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 12px 10px;
    font-weight: 700;
    font-size: 0.92rem;
    line-height: 1.4;
    text-align: center;
    color: var(--ink);
  }
  .dq-choice-btn:disabled { cursor: default; }
  .dq-choice-btn.correct { background: var(--correct); border-color: var(--correct-deep); color: #fff; box-shadow: 3px 3px 0 var(--correct-deep); }
  .dq-choice-btn.wrong { background: var(--wrong); border-color: var(--wrong-deep); color: #fff; box-shadow: 3px 3px 0 var(--wrong-deep); }
  .dq-choice-btn.dim { opacity: 0.45; }

  .dq-feedback { margin-top: 16px; animation: dq-feedback-in 0.28s ease-out; }
  @keyframes dq-feedback-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .dq-feedback-headline { font-weight: 800; font-size: 1.05rem; margin: 0 0 8px; }
  .dq-feedback-headline.correct { color: var(--correct-deep); }
  .dq-feedback-headline.wrong { color: var(--wrong-deep); }
  .dq-feedback-explain {
    background: var(--paper-2); border: 2px solid var(--ink); border-radius: 14px;
    padding: 12px 14px; font-size: 0.9rem; line-height: 1.6; font-weight: 500; margin: 0 0 14px;
  }
  .dq-next-btn { width: 100%; background: var(--amber); color: var(--ink); font-weight: 800; font-size: 1rem; padding: 13px; box-shadow: 3px 3px 0 var(--ink); }
  .dq-next-btn:active { background: var(--amber-deep); }

  /* ---------- result screen ---------- */
  .dq-result-card {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 24px;
    box-shadow: 4px 4px 0 var(--ink); padding: 22px 20px 24px; text-align: center;
  }
  .dq-tier-pill {
    display: inline-block; background: var(--moss); color: #fff; font-weight: 800; font-size: 0.85rem;
    padding: 6px 16px; border-radius: 999px; border: 2px solid var(--moss-deep); margin-bottom: 14px;
  }
  .dq-record-ribbon {
    display: inline-block; background: var(--amber); color: var(--ink); font-weight: 800; font-size: 0.8rem;
    padding: 5px 14px; border-radius: 999px; border: 2px solid var(--amber-deep); margin-bottom: 12px;
    animation: dq-pulse 1.1s ease-in-out infinite;
  }
  .dq-score-big { font-size: clamp(3rem, 16vw, 3.6rem); font-weight: 800; line-height: 1; color: var(--ink); }
  .dq-score-unit { font-weight: 700; font-size: 1rem; opacity: 0.7; margin-top: 2px; }
  .dq-result-sub { margin: 14px 0 0; font-size: 0.88rem; font-weight: 500; opacity: 0.75; }
  .dq-best-row { margin-top: 16px; display: flex; justify-content: center; gap: 22px; }
  .dq-best-item { text-align: center; }
  .dq-best-item-label { font-size: 0.72rem; font-weight: 700; opacity: 0.6; }
  .dq-best-item-num { font-size: 1.3rem; font-weight: 800; }

  @media (prefers-reduced-motion: reduce) {
    .dq-avatar-circle, .dq-feedback, .dq-badge.urgent .dq-badge-num, .dq-record-ribbon { animation: none !important; }
  }
</style>
</head>

  <div class="dq-frame" id="dq-frame"></div>
</div>

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickCharacter(excludeId) {
    var pool = excludeId ? CHARACTERS.filter(function (c) { return c.id !== excludeId; }) : CHARACTERS;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function tierFor(score) {
    if (score >= 15) return { title: '伝説の古生物学者', line: '……おどろいた。ここまでの正解者は、めったにいないぞ。伝説の古生物学者だな。' };
    if (score >= 10) return { title: 'きょうりゅうドクター', line: '見事だ。もう立派な恐竜ドクターと言っていいだろう。' };
    if (score >= 6) return { title: 'はくぶつかんガイド', line: 'ほう、なかなかの実力だ。博物館のガイドはまかせられそうだな。' };
    if (score >= 3) return { title: 'きょうりゅう研究1年生', line: 'なかなかやるな。基本はしっかり身についているようだ。' };
    return { title: 'たまごみならい', line: 'ふむ……。まだ恐竜たちのことを知らないようだな。もう一度ちょうせんしてみるがいい。' };
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  var GAME_SECONDS = 60;
  var STORAGE_KEY = 'dino_quiz_best_score';

  var state = {
    screen: 'start',
    timeLeft: GAME_SECONDS,
    score: 0,
    answeredCount: 0,
    deck: [],
    deckIndex: 0,
    currentQ: null,
    currentChar: CHARACTERS[0],
    selected: null,
    isAnswered: false,
    bestScore: 0,
    isNewRecord: false
  };
  var timerId = null;

  function loadBest() {
    try {
      var v = parseInt(window.localStorage.getItem(STORAGE_KEY), 10);
      if (!isNaN(v)) state.bestScore = v;
    } catch (e) {
      // localStorageが使えない環境ではベストスコア0のまま
    }
  }

  function saveBest(v) {
    try {
      window.localStorage.setItem(STORAGE_KEY, String(v));
    } catch (e) {
      // 保存できなくても今回の結果表示には影響しない
    }
  }

    var d = shuffle(QUESTIONS);
    state.deck = d;
    state.deckIndex = 1;
    state.currentQ = d[0];
    state.currentChar = pickCharacter(null);
    state.score = 0;
    state.answeredCount = 0;
    state.timeLeft = GAME_SECONDS;
    state.isNewRecord = false;
    state.selected = null;
    state.isAnswered = false;
    state.screen = 'playing';
    render();
    startTimer();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(function () {
      state.timeLeft -= 1;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        clearInterval(timerId);
        finishGame();
        return;
      }
      render();
    }, 1000);
  }

  function finishGame() {
    state.screen = 'result';
    if (state.score > state.bestScore) {
      state.bestScore = state.score;
      state.isNewRecord = true;
      saveBest(state.score);
    }
    render();
  }

  function handleAnswer(idx) {
    if (state.isAnswered || state.screen !== 'playing' || !state.currentQ) return;
    state.selected = idx;
    state.isAnswered = true;
    state.answeredCount += 1;
    if (idx === state.currentQ.correct) state.score += 1;
    render();
  }

  function handleNext() {
    if (state.timeLeft <= 0) return;
    var d = state.deck;
    var i = state.deckIndex;
    if (i >= d.length) { d = shuffle(QUESTIONS); i = 0; }
    state.deck = d;
    state.deckIndex = i + 1;
    state.currentQ = d[i];
    state.currentChar = pickCharacter(state.currentChar.id);
    state.selected = null;
    state.isAnswered = false;
    render();
  }

  function goHome() {
    clearInterval(timerId);
    state.screen = 'start';
    render();
  }

  function renderStart() {
    var lineup = CHARACTERS.map(function (c, i) {
      return '<div class="dq-avatar-circle" style="animation-delay:' + (i * 0.08) + 's"><img src="' + c.img + '" alt="' + c.name + '"></div>';
    }).join('');
    var bestPill = state.bestScore > 0 ? '<div class="dq-best-pill">じこベスト: ' + state.bestScore + ' もん</div>' : '';
    return '' +
      '<div class="dq-hero">' +
        '<h1 class="dq-title">きょうりゅうクイズ</h1>' +
        '<p class="dq-subtitle">1ぷんかんで なんもん せいかいできる?<br>4択(たく)クイズにこたえて、きょうりゅう博士(はかせ)をめざそう。</p>' +
      '</div>' +
      '<div class="dq-lineup">' + lineup + '</div>' +
      bestPill +
      '<button type="button" class="dq-btn-base dq-cta" data-action="start">スタート</button>';
  }

  function renderPlaying() {
    var q = state.currentQ;
    var urgent = state.timeLeft <= 10;
    var pct = Math.max(0, Math.min(100, (state.timeLeft / GAME_SECONDS) * 100));

    var choicesHtml = q.choices.map(function (choice, idx) {
      var cls = 'dq-choice-btn';
      if (state.isAnswered) {
        if (idx === q.correct) cls += ' correct';
        else if (idx === state.selected) cls += ' wrong';
        else cls += ' dim';
      }
      return '<button type="button" class="dq-btn-base ' + cls + '" data-action="answer" data-idx="' + idx + '"' + (state.isAnswered ? ' disabled' : '') + '>' + escapeHtml(choice) + '</button>';
    }).join('');

    var feedback = '';
    if (state.isAnswered) {
      var isCorrect = state.selected === q.correct;
      feedback = '' +
        '<div class="dq-feedback">' +
          '<p class="dq-feedback-headline ' + (isCorrect ? 'correct' : 'wrong') + '">' +
            (isCorrect ? 'せいかい! ' + state.currentChar.name + 'もにっこりだ' : 'ざんねん…… ' + state.currentChar.name + 'が解説するよ') +
          '</p>' +
          '<p class="dq-feedback-explain">' + escapeHtml(q.explain) + '</p>' +
          '<button type="button" class="dq-btn-base dq-next-btn" data-action="next">つぎの問題へ</button>' +
        '</div>';
    }

    return '' +
      '<div class="dq-topbar">' +
        '<div class="dq-badge' + (urgent ? ' urgent' : '') + '"><div class="dq-badge-label">のこり</div><div class="dq-badge-num">' + state.timeLeft + '</div></div>' +
        '<div class="dq-badge"><div class="dq-badge-label">せいかい</div><div class="dq-badge-num">' + state.score + '</div></div>' +
      '</div>' +
      '<div class="dq-progress-track"><div class="dq-progress-fill' + (urgent ? ' urgent' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="dq-stage">' +
        '<div class="dq-char-row">' +
          '<div class="dq-avatar-sm"><img src="' + state.currentChar.img + '" alt="' + state.currentChar.name + '"></div>' +
          '<div class="dq-speech">' +
            '<span class="dq-speech-name" style="background:' + state.currentChar.accent + ';border-color:' + state.currentChar.accentDeep + '">' + state.currentChar.name + '</span>' +
            '<p class="dq-question-text">' + escapeHtml(q.q) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="dq-choices">' + choicesHtml + '</div>' +
        feedback +
      '</div>';
  }

  function renderResult() {
    var tier = tierFor(state.score);
    var ribbon = state.isNewRecord ? '<div class="dq-record-ribbon">じこベスト こうしん!</div>' : '';
    return '' +
      '<div class="dq-char-row" style="align-items:flex-start">' +
        '<div class="dq-avatar-sm" style="width:72px;height:72px"><img src="' + HOST.img + '" alt="' + HOST.name + '"></div>' +
        '<div class="dq-speech">' +
          '<span class="dq-speech-name" style="background:' + HOST.accent + ';border-color:' + HOST.accentDeep + '">' + HOST.name + '</span>' +
          '<p class="dq-question-text" style="font-size:0.98rem">' + escapeHtml(tier.line) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="dq-result-card">' +
        ribbon +
        '<div class="dq-tier-pill">' + tier.title + '</div>' +
        '<div class="dq-score-big">' + state.score + '</div>' +
        '<div class="dq-score-unit">もん せいかい</div>' +
        '<p class="dq-result-sub">60びょうで ' + state.answeredCount + 'もんに こたえたよ</p>' +
        '<div class="dq-best-row">' +
          '<div class="dq-best-item"><div class="dq-best-item-label">今回</div><div class="dq-best-item-num">' + state.score + '</div></div>' +
          '<div class="dq-best-item"><div class="dq-best-item-label">じこベスト</div><div class="dq-best-item-num">' + state.bestScore + '</div></div>' +
        '</div>' +
      '</div>' +
      '<button type="button" class="dq-btn-base dq-cta" data-action="start">もういちど遊ぶ</button>' +
      '<button type="button" class="dq-ghost-btn" data-action="home">ホームにもどる</button>';
  }

  function render() {
    var frame = document.getElementById('dq-frame');
    if (state.screen === 'start') frame.innerHTML = renderStart();
    else if (state.screen === 'playing') frame.innerHTML = renderPlaying();
    else frame.innerHTML = renderResult();
  }

  document.getElementById('dq-frame').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'start') startGame();
    else if (action === 'answer') handleAnswer(parseInt(btn.getAttribute('data-idx'), 10));
    else if (action === 'next') handleNext();
    else if (action === 'home') goHome();
  });

  loadBest();
  render();
})();
</script>
</body>
</html>
